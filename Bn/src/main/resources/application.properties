spring.application.name=fotdatadb

spring.datasource.url=jdbc:mysql://localhost:3306/fotdatadb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

football-data.api.base-url=https://api.football-data.org
football-data.api.token=${FOOTBALL_DATA_API_TOKEN:}

admin.api-key=${ADMIN_API_KEY:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
